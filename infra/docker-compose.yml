name: darb-city
services:
  postgres:
    build: ./postgres
    environment:
      POSTGRES_USER: darb
      POSTGRES_PASSWORD: darb
      POSTGRES_DB: darb
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/20-darb-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darb -d darb"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
