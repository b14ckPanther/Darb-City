name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://darb:darb@localhost:5433/darb
      TEST_DATABASE_URL: postgresql://darb:darb@localhost:5433/darb_test
      API_URL: http://localhost:4000
      SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      SEARCH_PROXY_KEY: ci-proxy-key
      # Production builds serve the map from the 1 KB fixture via /api/tiles (no R2 in CI).
      NEXT_PUBLIC_LOCAL_TILES: "1"
      # No network and no keys: the model is replayed from recordings, embeddings are an offline hash.
      INTENT_PROVIDER: recorded
      EMBEDDING_PROVIDER: hash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Postgres with PostGIS and pgvector (infra/postgres/Dockerfile), and Redis
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres redis
      - run: cp apps/api/.env.example apps/api/.env
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: No model keys in CI (tests replay recordings and use offline embeddings)
        run: test -z "${ANTHROPIC_API_KEY}${VOYAGE_API_KEY}"
      - name: Unit and API integration tests
        run: pnpm test
      # CI never downloads map tiles: e2e serves the committed 1 KB fixture (MAP_TILES_DIR in
      # apps/web/playwright.config.ts). This keeps the fixture equal to what its generator writes.
      - name: Map test tiles are reproducible
        run: pnpm --filter @darb/web exec node scripts/tiles/make-test-tiles.mjs --check
      - name: Migrate and seed the e2e database
        run: pnpm --filter @darb/api db:deploy && pnpm --filter @darb/api db:seed
      - name: The migrated database matches the Prisma schema (no drift)
        run: pnpm --filter @darb/api exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Search quality set (recorded intents, offline embeddings)
        run: pnpm --filter @darb/api search:quality
      - name: First-load JS, lazy stage and lazy search budgets
        run: pnpm --filter @darb/web budget
      - run: pnpm --filter @darb/web exec playwright install --with-deps chromium
      - name: End-to-end, accessibility and LCP
        run: pnpm --filter @darb/web e2e
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14
