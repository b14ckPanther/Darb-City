name: Warm production pages

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    # Off until the cut-over sets the WARM_SITE_URL variable: before it, darb.co.il is the old site,
    # which has no sitemap, and a failed run here makes Railway skip API deploys of that commit.
    if: >-
      vars.WARM_SITE_URL != '' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node apps/web/scripts/warm.mjs ${{ vars.WARM_SITE_URL }}
