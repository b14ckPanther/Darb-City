name: Warm production pages

# Manual only: warming after every deploy rendered about 3,400 pages each time, and a busy week of
# merges spent the database's whole monthly network allowance (Neon, 2026-10-20).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    if: vars.WARM_SITE_URL != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node apps/web/scripts/warm.mjs ${{ vars.WARM_SITE_URL }}
